# criterion_cards.YAML
# Criterion cards for SNF prior authorization review (cards A1, A7, A8, A11-A17).
# Text fields marked "verbatim" are copied from the regulation; summary_zh is a Chinese translation
# written by Claude, so cite the English text, not the translation.

meta:
  source: 42 CFR Part 409, Subpart D (eCFR, version dated 2026-10-01, retrieved 2026-10-31)
  source_file: policy_docs/42cfr409_subpartD.xml
  card_types:
    requirement: a condition the beneficiary / request must satisfy
    definition: defines a term used by a requirement
    interpretive_rule: tells the reviewer how to judge a requirement
    examples: non-exhaustive illustrations (the regulation heading says "Examples")
    exclusion: services that do not count as skilled
  plan_criterion: mapping to the C0-C8 criteria in plan/snf_pa_consensus_work_plan_1025.md (assigned by Claude, not by the regulation)

cards:
  - id: A1
    cfr: 42 CFR 409.30(a)(1)
    type: requirement
    plan_criterion: C1
    title: Qualifying inpatient hospital stay
    lead_in_verbatim: The beneficiary must—
    text_verbatim: >-
      Have been hospitalized in a participating or qualified hospital or participating CAH, for medically
      necessary inpatient hospital or inpatient CAH care, for at least 3 consecutive calendar days, not
      counting the date of discharge; and
    summary_zh: 病人须因医学必要的住院照护连续住院至少 3 个日历日，不含出院当天。
    see_also:
      - 42 CFR 409.30(b)(2)(ii)  # enrollee of an MA plan offering the 422.101(c) benefit is deemed to meet (a) and (b)
      - 42 CFR 422.101(c)(2)     # MA plans may elect to waive the prior qualifying hospital stay

  - id: A7
    cfr: 42 CFR 409.31(a)
    type: definition
    plan_criterion: C4
    title: Definition of skilled nursing and skilled rehabilitation services
    text_verbatim: >-
      As used in this section, skilled nursing and skilled rehabilitation services means services that:
    conditions_verbatim:
      - Are ordered by a physician;
      - >-
        Require the skills of technical or professional personnel such as registered nurses, licensed
        practical (vocational) nurses, physical therapists, occupational therapists, and speech
        pathologists or audiologists; and
      - Are furnished directly by, or under the supervision of, such personnel.
    summary_zh: skilled 服务必须同时满足：有医师医嘱；需要 RN、LPN、PT、OT、言语治疗师或听力师等人员的技能；由这些人员直接提供或在其监督下提供。

  - id: A8
    cfr: 42 CFR 409.31(b)(1)
    type: requirement
    plan_criterion: C4
    title: Daily skilled need
    text_verbatim: >-
      The beneficiary must require skilled nursing or skilled rehabilitation services, or both, on a daily
      basis.
    summary_zh: 病人必须每天需要 skilled nursing 或 skilled rehab，或两者。
    see_also:
      - 42 CFR 409.34(a)  # defines "daily basis": 7 days a week; rehab at least 5 days a week if not available 7 days

  - id: A11
    cfr: 42 CFR 409.32(a)
    type: definition
    plan_criterion: C4
    title: What makes a service skilled (complexity)
    text_verbatim: >-
      To be considered a skilled service, the service must be so inherently complex that it can be safely
      and effectively performed only by, or under the supervision of, professional or technical personnel.
    summary_zh: 服务要复杂到只能由专业或技术人员安全有效地做，或在其监督下做，才算 skilled。

  - id: A12
    cfr: 42 CFR 409.32(b)
    type: interpretive_rule
    plan_criterion: C4
    title: Special medical complications can make a usually non-skilled service skilled
    text_verbatim: >-
      A condition that does not ordinarily require skilled services may require them because of special
      medical complications. Under those circumstances, a service that is usually nonskilled (such as those
      listed in § 409.33(d)) may be considered skilled because it must be performed or supervised by skilled
      nursing or rehabilitation personnel. For example, a plaster cast on a leg does not usually require
      skilled care. However, if the patient has a preexisting acute skin condition or needs traction, skilled
      personnel may be needed to adjust traction or watch for complications. In situations of this type, the
      complications, and the skilled services they require, must be documented by physicians' orders and
      nursing or therapy notes.
    documentation_required_verbatim: >-
      the complications, and the skilled services they require, must be documented by physicians' orders and
      nursing or therapy notes
    summary_zh: 通常不需要技能的病情，因特殊并发症可能需要；此时通常非技能的服务（如 §409.33(d) 所列）可算 skilled。并发症和所需技能服务必须有医嘱和护理或治疗记录。

  - id: A13
    cfr: 42 CFR 409.32(c)
    type: interpretive_rule
    plan_criterion: C4
    title: Restoration potential is not the deciding factor
    text_verbatim: >-
      The restoration potential of a patient is not the deciding factor in determining whether skilled
      services are needed. Even if full recovery or medical improvement is not possible, a patient may need
      skilled services to prevent further deterioration or preserve current capabilities. For example, a
      terminal cancer patient may need some of the skilled services described in § 409.33.
    summary_zh: 恢复潜力不是判断是否需要 skilled 服务的决定因素；即使无法完全恢复或改善，为防止恶化或保持现有能力也可需要 skilled 服务。
    guardrail: A denial must not rest on "no improvement potential" alone.  # reading of the text above, not regulation wording

  - id: A14
    cfr: 42 CFR 409.33(a)
    type: examples
    plan_criterion: C4
    title: Services that could qualify as either skilled nursing or skilled rehabilitation
    parts:
      - id: A14.1
        cfr: 42 CFR 409.33(a)(1)
        title: Overall management and evaluation of care plan
        text_verbatim: >-
          The development, management, and evaluation of a patient care plan based on the physician's orders
          constitute skilled services when, because of the patient's physical or mental condition, those
          activities require the involvement of technical or professional personnel in order to meet the
          patient's needs, promote recovery, and ensure medical safety. Those activities include the
          management of a plan involving a variety of personal care services only when, in light of the
          patient's condition, the aggregate of those services requires the involvement of technical or
          professional personnel.
        example_verbatim: >-
          An aged patient with a history of diabetes mellitus and angina pectoris who is recovering from an
          open reduction of a fracture of the neck of the femur requires, among other services, careful skin
          care, appropriate oral medications, a diabetic diet, an exercise program to preserve muscle tone
          and body condition, and observation to detect signs of deterioration in his or her condition or
          complications resulting from restricted, but increasing, mobility. Although any of the required
          services could be performed by a properly instructed person, such a person would not have the
          ability to understand the relationship between the services and evaluate the ultimate effect of one
          service on the other. Since the nature of the patient's condition, age, and immobility create a
          high potential for serious complications, such an understanding is essential to ensure the
          patient's recovery and safety. Under these circumstances, the management of the plan of care would
          require the skills of a nurse even though the individual services are not skilled. Skilled
          planning and management activities are not always specifically identified in the patient's
          clinical record. Therefore, if the patient's overall condition supports a finding that recovery and
          safety can be ensured only if the total care is planned, managed, and evaluated by technical or
          professional personnel, it is appropriate to infer that skilled services are being provided.
        inference_allowed: true  # the last sentence of the example permits inferring skilled management
        summary_zh: 照护计划的管理与评估，当病人状况使其必须有专业人员参与时即为 skilled；病历不一定明写，可从整体状况推断。
      - id: A14.2
        cfr: 42 CFR 409.33(a)(2)
        title: Observation and assessment of the patient's changing condition
        text_verbatim: >-
          Observation and assessment constitute skilled services when the skills of a technical or
          professional person are required to identify and evaluate the patient's need for modification of
          treatment or for additional medical procedures until his or her condition is stabilized.
        example_verbatim: >-
          A patient with congestive heart failure may require continuous close observation to detect signs
          of decompensation, abnormal fluid balance, or adverse effects resulting from prescribed
          medication(s) that serve as indicators for adjusting therapeutic measures. Similarly, surgical
          patients transferred from a hospital to an SNF while in the complicated, unstabilized
          postoperative period, for example, after hip prosthesis or cataract surgery, may need continued
          close skilled monitoring for postoperative complications and adverse reaction. Patients who, in
          addition to their physical problems, exhibit acute psychological symptoms such as depression,
          anxiety, or agitation, may also require skilled observation and assessment by technical or
          professional personnel to ensure their safety or the safety of others, that is, to observe for
          indications of suicidal or hostile behavior. The need for services of this type must be documented
          by physicians' orders or nursing or therapy notes.
        documentation_required_verbatim: >-
          The need for services of this type must be documented by physicians' orders or nursing or therapy
          notes.
        summary_zh: 当需要专业人员识别并评估是否要调整治疗或增加医疗程序、直到病情稳定时，观察与评估即为 skilled；需有医嘱或护理、治疗记录。
      - id: A14.3
        cfr: 42 CFR 409.33(a)(3)
        title: Patient education services
        text_verbatim: >-
          Patient education services are skilled services if the use of technical or professional personnel
          is necessary to teach a patient self-maintenance.
        example_verbatim: >-
          A patient who has had a recent leg amputation needs skilled rehabilitation services provided by
          technical or professional personnel to provide gait training and to teach prosthesis care.
          Similarly, a patient newly diagnosed with diabetes requires instruction from technical or
          professional personnel to learn the self-administration of insulin or foot-care precautions.
        summary_zh: 若必须由专业人员来教病人自我维护，病人教育即为 skilled。

  - id: A15
    cfr: 42 CFR 409.33(b)
    type: examples
    plan_criterion: C4
    title: Services that qualify as skilled nursing services
    items_verbatim:
      - Intravenous or intramuscular injections and intravenous feeding.
      - Enteral feeding that comprises at least 26 per cent of daily calorie requirements and provides at least 501 milliliters of fluid per day.
      - Nasopharyngeal and tracheostomy aspiration;
      - Insertion and sterile irrigation and replacement of suprapubic catheters;
      - Application of dressings involving prescription medications and aseptic techniques;
      - Treatment of extensive decubitus ulcers or other widespread skin disorder;
      - Heat treatments which have been specifically ordered by a physician as part of active treatment and which require observation by nurses to adequately evaluate the patient's progress;
      - Initial phases of a regimen involving administration of medical gases;
      - Rehabilitation nursing procedures, including the related teaching and adaptive aspects of nursing, that are part of active treatment, e.g., the institution and supervision of bowel and bladder training programs.
    summary_zh: 静脉或肌肉注射与静脉营养；肠内营养（≥26% 每日热量且 ≥501 ml 液体）；气道吸引；耻骨上导尿管；含处方药的无菌敷料；广泛褥疮；医嘱热疗；医疗气体初始阶段；康复护理（膀胱、肠道训练）。

  - id: A16
    cfr: 42 CFR 409.33(c)
    type: examples
    plan_criterion: C4
    title: Services which would qualify as skilled rehabilitation services
    items_verbatim:
      - "Ongoing assessment of rehabilitation needs and potential: Services concurrent with the management of a patient care plan, including tests and measurements of range of motion, strength, balance, coordination, endurance, functional ability, activities of daily living, perceptual deficits, speech and language or hearing disorders;"
      - "Therapeutic exercises or activities: Therapeutic exercises or activities which, because of the type of exercises employed or the condition of the patient, must be performed by or under the supervision of a qualified physical therapist or occupational therapist to ensure the safety of the patient and the effectiveness of the treatment;"
      - "Gait evaluation and training: Gait evaluation and training furnished to restore function in a patient whose ability to walk has been impaired by neurological, muscular, or skeletal abnormality;"
      - "Range of motion exercises: Range of motion exercises which are part of the active treatment of a specific disease state which has resulted in a loss of, or restriction of, mobility (as evidenced by a therapist's notes showing the degree of motion lost and the degree to be restored);"
      - "Maintenance therapy; Maintenance therapy, when the specialized knowledge and judgment of a qualified therapist is required to design and establish a maintenance program based on an initial evaluation and periodic reassessment of the patient's needs, and consistent with the patient's capacity and tolerance. For example, a patient with Parkinson's disease who has not been under a rehabilitation regimen may require the services of a qualified therapist to determine what type of exercises will contribute the most to the maintenance of his present level of functioning."
      - Ultrasound, short-wave, and microwave therapy treatment by a qualified physical therapist;
      - "Hot pack, hydrocollator, infrared treatments, paraffin baths, and whirlpool; Hot pack hydrocollator, infrared treatments, paraffin baths, and whirlpool in particular cases where the patient's condition is complicated by circulatory deficiency, areas of desensitization, open wounds, fractures, or other complications, and the skills, knowledge, and judgment of a qualified physical therapist are required; and"
      - Services of a speech pathologist or audiologist when necessary for the restoration of function in speech or hearing.
    note: Item 5 (maintenance therapy) means maintenance programs designed by a therapist can be skilled rehab.
    summary_zh: 康复需求评估；治疗性运动；步态训练；关节活动度训练；维持性治疗（需治疗师设计方案）；超声、短波、微波；有并发症时的热敷等理疗；言语或听力治疗。

  - id: A17
    cfr: 42 CFR 409.33(d)
    type: exclusion
    plan_criterion: C4
    title: Personal care services (not skilled)
    text_verbatim: >-
      Personal care services which do not require the skills of qualified technical or professional
      personnel are not skilled services except under the circumstances specified in § 409.32(b). Personal
      care services include, but are not limited to, the following:
    exception: 42 CFR 409.32(b)  # see card A12
    items_verbatim:
      - Administration of routine oral medications, eye drops, and ointments;
      - General maintenance care of colostomy and ileostomy;
      - Routine services to maintain satisfactory functioning of indwelling bladder catheters;
      - Changes of dressings for noninfected postoperative or chronic conditions;
      - Prophylactic and palliative skin care, including bathing and application of creams, or treatment of minor skin problems;
      - Routine care of the incontinent patient, including use of diapers and protective sheets;
      - General maintenance care in connection with a plaster cast;
      - Routine care in connection with braces and similar devices;
      - Use of heat as a palliative and comfort measure, such as whirlpool and hydrocollator;
      - Routine administration of medical gases after a regimen of therapy has been established;
      - Assistance in dressing, eating, and going to the toilet;
      - Periodic turning and positioning in bed; and
      - "General supervision of exercises which have been taught to the patient; including the actual carrying out of maintenance programs, i.e., the performance of the repetitive exercises required to maintain function do not require the skills of a therapist and would not constitute skilled rehabilitation services (see paragraph (c) of this section). Similarly, repetitious exercises to improve gait, maintain strength, or endurance; passive exercises to maintain range of motion in paralyzed extremities, which are not related to a specific loss of function; and assistive walking do not constitute skilled rehabilitation services."
    summary_zh: 不需要专业人员技能的个人护理不是 skilled（A12 的特殊并发症情形除外），如常规口服药、协助穿衣进食如厕、翻身摆体位、一般监督已教会的运动等。
