# criterion_cards.yaml
# Criterion cards for SNF prior authorization review (cards A1, A2, A7-A20).
# Text fields marked "verbatim" are copied from the regulation; summary_zh is a Chinese translation
# written by Claude, so cite the English text, not the translation.
# The evidence_hints section at the end is Claude's guidance for C3-C6, not regulation text; it is kept
# apart from the cards so a prompt can include or omit it.

meta:
  source: 42 CFR Part 409, Subpart D (eCFR, version dated 2026-10-01, retrieved 2026-10-31)
  source_file: policy_docs/42cfr409_subpartD.xml
  card_types:
    requirement: a condition the beneficiary / request must satisfy
    definition: defines a term used by a requirement
    interpretive_rule: tells the reviewer how to judge a requirement
    examples: non-exhaustive illustrations (the regulation heading says "Examples")
    exclusion: services that do not count as skilled
  plan_criterion: mapping to the C0-C8 criteria in plan/snf_pa_consensus_work_plan_1025.md (assigned by Claude, not by the regulation); a list when a card serves more than one
  card_shapes: >-
    Every card has id, cfr, type, plan_criterion, title, summary_zh. The regulation text is in one of:
    text_verbatim (a paragraph); text_verbatim + conditions_verbatim or items_verbatim (lead-in plus a
    list); parts (sub-cards with their own cfr and text_verbatim, used by A14). items_verbatim entries
    are either a string or {heading, text_verbatim} when the regulation gives the item an italic heading.
    Optional: lead_in_verbatim, example_verbatim, documentation_required_verbatim, see_also, exception,
    note, guardrail (notes and guardrails are Claude's reading, not regulation wording).

cards:
  - id: A1
    cfr: 42 CFR 409.30(a)(1)
    type: requirement
    plan_criterion: C1
    title: Qualifying inpatient hospital stay
    lead_in_verbatim: The beneficiary must—
    text_verbatim: >-
      Have been hospitalized in a participating or qualified hospital or participating CAH, for medically
      necessary inpatient hospital or inpatient CAH care, for at least 3 consecutive calendar days, not
      counting the date of discharge; and
    summary_zh: 病人须因医学必要的住院照护连续住院至少 3 个日历日，不含出院当天。
    see_also:
      - 42 CFR 409.30(a)(2)      # the second pre-admission condition, card A2
      - 42 CFR 409.30(b)(2)(ii)  # enrollee of an MA plan offering the 422.101(c) benefit is deemed to meet 409.30(a) and (b) and 409.31(b)(2) (card A9) for the whole SNF stay
      - 42 CFR 422.101(c)(2)     # MA plans may elect to waive the prior qualifying hospital stay

  - id: A2
    cfr: 42 CFR 409.30(a)(2)
    type: requirement
    plan_criterion: C0
    title: Discharged when entitled to Part A
    lead_in_verbatim: The beneficiary must—
    text_verbatim: >-
      Have been discharged from the hospital or CAH in or after the month he or she attained age 65, or in a
      month for which he or she was entitled to hospital insurance benefits on the basis of disability or
      end-stage renal disease, in accordance with part 406 of this chapter.
    summary_zh: 出院当月病人已满 65 岁，或因残障、终末期肾病已有 Part A 住院保险资格。
    note: The cohort is restricted to age 65 or older at admission, so this is met by construction for the sample.
    see_also:
      - 42 CFR 409.30(b)(2)(ii)  # MA waiver deems this met as well

  - id: A7
    cfr: 42 CFR 409.31(a)
    type: definition
    plan_criterion: C4
    title: Definition of skilled nursing and skilled rehabilitation services
    text_verbatim: >-
      As used in this section, skilled nursing and skilled rehabilitation services means services that:
    conditions_verbatim:
      - Are ordered by a physician;
      - >-
        Require the skills of technical or professional personnel such as registered nurses, licensed
        practical (vocational) nurses, physical therapists, occupational therapists, and speech
        pathologists or audiologists; and
      - Are furnished directly by, or under the supervision of, such personnel.
    summary_zh: skilled 服务必须同时满足：有医师医嘱；需要 RN、LPN、PT、OT、言语治疗师或听力师等人员的技能；由这些人员直接提供或在其监督下提供。

  - id: A8
    cfr: 42 CFR 409.31(b)(1)
    type: requirement
    plan_criterion: [C4, C5]
    title: Daily skilled need
    text_verbatim: >-
      The beneficiary must require skilled nursing or skilled rehabilitation services, or both, on a daily
      basis.
    summary_zh: 病人必须每天需要 skilled nursing 或 skilled rehab，或两者。
    see_also:
      - 42 CFR 409.34  # defines "daily basis", cards A18 and A19

  - id: A9
    cfr: 42 CFR 409.31(b)(2)
    type: requirement
    plan_criterion: C3
    title: Services are for a hospital-treated condition
    text_verbatim: >-
      Those services must be furnished for a condition—
    conditions_verbatim:
      - For which the beneficiary received inpatient hospital or inpatient CAH services; or
      - >-
        Which arose while the beneficiary was receiving care in a SNF or swing-bed hospital for a condition
        for which he or she received inpatient hospital or inpatient CAH services; or
      - >-
        For which, for an M + C enrollee described in § 409.20(c)(4), a physician has determined that a
        direct admission to a SNF without an inpatient hospital or inpatient CAH stay would be medically
        appropriate.
    summary_zh: skilled 服务须针对以下任一病情：住院期间治疗过的病情；在 SNF 接受该病情照护期间新出现的病情；或（MA 参保人）医师认为无需住院、直接入住 SNF 在医学上合适的病情。
    note: The conditions are alternatives (joined by "or"); for a discharge-time PA request the first one is the usual test.
    see_also:
      - 42 CFR 409.30(b)(2)(ii)  # MA waiver deems this met

  - id: A10
    cfr: 42 CFR 409.31(b)(3)
    type: requirement
    plan_criterion: C6
    title: Practical matter - only feasible as SNF inpatient
    text_verbatim: >-
      The daily skilled services must be ones that, as a practical matter, can only be provided in a SNF, on
      an inpatient basis.
    summary_zh: 这些每日 skilled 服务，从实际情况看只能在 SNF 住院环境中提供。
    see_also:
      - 42 CFR 409.35  # criteria for "practical matter", card A20

  - id: A11
    cfr: 42 CFR 409.32(a)
    type: definition
    plan_criterion: C4
    title: What makes a service skilled (complexity)
    text_verbatim: >-
      To be considered a skilled service, the service must be so inherently complex that it can be safely
      and effectively performed only by, or under the supervision of, professional or technical personnel.
    summary_zh: 服务要复杂到只能由专业或技术人员安全有效地做，或在其监督下做，才算 skilled。

  - id: A12
    cfr: 42 CFR 409.32(b)
    type: interpretive_rule
    plan_criterion: C4
    title: Special medical complications can make a usually non-skilled service skilled
    text_verbatim: >-
      A condition that does not ordinarily require skilled services may require them because of special
      medical complications. Under those circumstances, a service that is usually nonskilled (such as those
      listed in § 409.33(d)) may be considered skilled because it must be performed or supervised by skilled
      nursing or rehabilitation personnel. For example, a plaster cast on a leg does not usually require
      skilled care. However, if the patient has a preexisting acute skin condition or needs traction, skilled
      personnel may be needed to adjust traction or watch for complications. In situations of this type, the
      complications, and the skilled services they require, must be documented by physicians' orders and
      nursing or therapy notes.
    documentation_required_verbatim: >-
      the complications, and the skilled services they require, must be documented by physicians' orders and
      nursing or therapy notes
    summary_zh: 通常不需要技能的病情，因特殊并发症可能需要；此时通常非技能的服务（如 §409.33(d) 所列）可算 skilled。并发症和所需技能服务必须有医嘱和护理或治疗记录。

  - id: A13
    cfr: 42 CFR 409.32(c)
    type: interpretive_rule
    plan_criterion: C4
    title: Restoration potential is not the deciding factor
    text_verbatim: >-
      The restoration potential of a patient is not the deciding factor in determining whether skilled
      services are needed. Even if full recovery or medical improvement is not possible, a patient may need
      skilled services to prevent further deterioration or preserve current capabilities. For example, a
      terminal cancer patient may need some of the skilled services described in § 409.33.
    summary_zh: 恢复潜力不是判断是否需要 skilled 服务的决定因素；即使无法完全恢复或改善，为防止恶化或保持现有能力也可需要 skilled 服务。
    guardrail: A denial must not rest on "no improvement potential" alone.  # reading of the text above, not regulation wording

  - id: A14
    cfr: 42 CFR 409.33(a)
    type: examples
    plan_criterion: C4
    title: Services that could qualify as either skilled nursing or skilled rehabilitation
    summary_zh: 可算 skilled nursing 或 skilled rehab 的三类服务：照护计划的管理与评估、观察与评估病情变化、病人教育。
    parts:
      - id: A14.1
        cfr: 42 CFR 409.33(a)(1)
        title: Overall management and evaluation of care plan
        text_verbatim: >-
          The development, management, and evaluation of a patient care plan based on the physician's orders
          constitute skilled services when, because of the patient's physical or mental condition, those
          activities require the involvement of technical or professional personnel in order to meet the
          patient's needs, promote recovery, and ensure medical safety. Those activities include the
          management of a plan involving a variety of personal care services only when, in light of the
          patient's condition, the aggregate of those services requires the involvement of technical or
          professional personnel.
        example_verbatim: >-
          An aged patient with a history of diabetes mellitus and angina pectoris who is recovering from an
          open reduction of a fracture of the neck of the femur requires, among other services, careful skin
          care, appropriate oral medications, a diabetic diet, an exercise program to preserve muscle tone
          and body condition, and observation to detect signs of deterioration in his or her condition or
          complications resulting from restricted, but increasing, mobility. Although any of the required
          services could be performed by a properly instructed person, such a person would not have the
          ability to understand the relationship between the services and evaluate the ultimate effect of one
          service on the other. Since the nature of the patient's condition, age, and immobility create a
          high potential for serious complications, such an understanding is essential to ensure the
          patient's recovery and safety. Under these circumstances, the management of the plan of care would
          require the skills of a nurse even though the individual services are not skilled. Skilled
          planning and management activities are not always specifically identified in the patient's
          clinical record. Therefore, if the patient's overall condition supports a finding that recovery and
          safety can be ensured only if the total care is planned, managed, and evaluated by technical or
          professional personnel, it is appropriate to infer that skilled services are being provided.
        inference_allowed: true  # the last sentence of the example permits inferring skilled management
        summary_zh: 照护计划的管理与评估，当病人状况使其必须有专业人员参与时即为 skilled；病历不一定明写，可从整体状况推断。
      - id: A14.2
        cfr: 42 CFR 409.33(a)(2)
        title: Observation and assessment of the patient's changing condition
        text_verbatim: >-
          Observation and assessment constitute skilled services when the skills of a technical or
          professional person are required to identify and evaluate the patient's need for modification of
          treatment or for additional medical procedures until his or her condition is stabilized.
        example_verbatim: >-
          A patient with congestive heart failure may require continuous close observation to detect signs
          of decompensation, abnormal fluid balance, or adverse effects resulting from prescribed
          medication(s) that serve as indicators for adjusting therapeutic measures. Similarly, surgical
          patients transferred from a hospital to an SNF while in the complicated, unstabilized
          postoperative period, for example, after hip prosthesis or cataract surgery, may need continued
          close skilled monitoring for postoperative complications and adverse reaction. Patients who, in
          addition to their physical problems, exhibit acute psychological symptoms such as depression,
          anxiety, or agitation, may also require skilled observation and assessment by technical or
          professional personnel to ensure their safety or the safety of others, that is, to observe for
          indications of suicidal or hostile behavior. The need for services of this type must be documented
          by physicians' orders or nursing or therapy notes.
        documentation_required_verbatim: >-
          The need for services of this type must be documented by physicians' orders or nursing or therapy
          notes.
        summary_zh: 当需要专业人员识别并评估是否要调整治疗或增加医疗程序、直到病情稳定时，观察与评估即为 skilled；需有医嘱或护理、治疗记录。
      - id: A14.3
        cfr: 42 CFR 409.33(a)(3)
        title: Patient education services
        text_verbatim: >-
          Patient education services are skilled services if the use of technical or professional personnel
          is necessary to teach a patient self-maintenance.
        example_verbatim: >-
          A patient who has had a recent leg amputation needs skilled rehabilitation services provided by
          technical or professional personnel to provide gait training and to teach prosthesis care.
          Similarly, a patient newly diagnosed with diabetes requires instruction from technical or
          professional personnel to learn the self-administration of insulin or foot-care precautions.
        summary_zh: 若必须由专业人员来教病人自我维护，病人教育即为 skilled。

  - id: A15
    cfr: 42 CFR 409.33(b)
    type: examples
    plan_criterion: C4
    title: Services that qualify as skilled nursing services
    items_verbatim:
      - Intravenous or intramuscular injections and intravenous feeding.
      - Enteral feeding that comprises at least 26 per cent of daily calorie requirements and provides at least 501 milliliters of fluid per day.
      - Nasopharyngeal and tracheostomy aspiration;
      - Insertion and sterile irrigation and replacement of suprapubic catheters;
      - Application of dressings involving prescription medications and aseptic techniques;
      - Treatment of extensive decubitus ulcers or other widespread skin disorder;
      - Heat treatments which have been specifically ordered by a physician as part of active treatment and which require observation by nurses to adequately evaluate the patient's progress;
      - Initial phases of a regimen involving administration of medical gases;
      - Rehabilitation nursing procedures, including the related teaching and adaptive aspects of nursing, that are part of active treatment, e.g., the institution and supervision of bowel and bladder training programs.
    summary_zh: 静脉或肌肉注射与静脉营养；肠内营养（≥26% 每日热量且 ≥501 ml 液体）；气道吸引；耻骨上导尿管；含处方药的无菌敷料；广泛褥疮；医嘱热疗；医疗气体初始阶段；康复护理（膀胱、肠道训练）。

  - id: A16
    cfr: 42 CFR 409.33(c)
    type: examples
    plan_criterion: C4
    title: Services which would qualify as skilled rehabilitation services
    items_verbatim:
      - heading: "Ongoing assessment of rehabilitation needs and potential:"
        text_verbatim: "Services concurrent with the management of a patient care plan, including tests and measurements of range of motion, strength, balance, coordination, endurance, functional ability, activities of daily living, perceptual deficits, speech and language or hearing disorders;"
      - heading: "Therapeutic exercises or activities:"
        text_verbatim: "Therapeutic exercises or activities which, because of the type of exercises employed or the condition of the patient, must be performed by or under the supervision of a qualified physical therapist or occupational therapist to ensure the safety of the patient and the effectiveness of the treatment;"
      - heading: "Gait evaluation and training:"
        text_verbatim: "Gait evaluation and training furnished to restore function in a patient whose ability to walk has been impaired by neurological, muscular, or skeletal abnormality;"
      - heading: "Range of motion exercises:"
        text_verbatim: "Range of motion exercises which are part of the active treatment of a specific disease state which has resulted in a loss of, or restriction of, mobility (as evidenced by a therapist's notes showing the degree of motion lost and the degree to be restored);"
      - heading: "Maintenance therapy;"
        text_verbatim: "Maintenance therapy, when the specialized knowledge and judgment of a qualified therapist is required to design and establish a maintenance program based on an initial evaluation and periodic reassessment of the patient's needs, and consistent with the patient's capacity and tolerance. For example, a patient with Parkinson's disease who has not been under a rehabilitation regimen may require the services of a qualified therapist to determine what type of exercises will contribute the most to the maintenance of his present level of functioning."
      - Ultrasound, short-wave, and microwave therapy treatment by a qualified physical therapist;
      - heading: "Hot pack, hydrocollator, infrared treatments, paraffin baths, and whirlpool;"
        text_verbatim: "Hot pack hydrocollator, infrared treatments, paraffin baths, and whirlpool in particular cases where the patient's condition is complicated by circulatory deficiency, areas of desensitization, open wounds, fractures, or other complications, and the skills, knowledge, and judgment of a qualified physical therapist are required; and"
      - Services of a speech pathologist or audiologist when necessary for the restoration of function in speech or hearing.
    note: >-
      Item 5: the regulation makes the therapist's design and establishment of a maintenance program skilled.
      Since the Jimmo v. Sebelius manual update (2014), Ch.8 §30.4.1.2.E also treats carrying out a
      maintenance program as skilled when the patient's special medical complications or the complexity of
      the procedures require a qualified therapist to perform it safely and effectively, regardless of
      improvement potential. Repetitive exercises that non-therapists can do safely stay non-skilled (card A17).
    see_also:
      - Medicare Benefit Policy Manual Ch.8 §30.4.1.2.E  # maintenance therapy (bp102c08.pdf p.37-38)
      - 42 CFR 409.32(c)  # restoration potential is not the deciding factor, card A13
    summary_zh: 康复需求评估；治疗性运动；步态训练；关节活动度训练；维持性治疗（需治疗师设计方案）；超声、短波、微波；有并发症时的热敷等理疗；言语或听力治疗。

  - id: A17
    cfr: 42 CFR 409.33(d)
    type: exclusion
    plan_criterion: C4
    title: Personal care services (not skilled)
    text_verbatim: >-
      Personal care services which do not require the skills of qualified technical or professional
      personnel are not skilled services except under the circumstances specified in § 409.32(b). Personal
      care services include, but are not limited to, the following:
    exception: 42 CFR 409.32(b)  # see card A12
    see_also:
      - Medicare Benefit Policy Manual Ch.8 §30.4.1.2.E  # carrying out a maintenance program can be skilled when it needs a therapist; see card A16 note
    items_verbatim:
      - Administration of routine oral medications, eye drops, and ointments;
      - General maintenance care of colostomy and ileostomy;
      - Routine services to maintain satisfactory functioning of indwelling bladder catheters;
      - Changes of dressings for noninfected postoperative or chronic conditions;
      - Prophylactic and palliative skin care, including bathing and application of creams, or treatment of minor skin problems;
      - Routine care of the incontinent patient, including use of diapers and protective sheets;
      - General maintenance care in connection with a plaster cast;
      - Routine care in connection with braces and similar devices;
      - Use of heat as a palliative and comfort measure, such as whirlpool and hydrocollator;
      - Routine administration of medical gases after a regimen of therapy has been established;
      - Assistance in dressing, eating, and going to the toilet;
      - Periodic turning and positioning in bed; and
      - "General supervision of exercises which have been taught to the patient; including the actual carrying out of maintenance programs, i.e., the performance of the repetitive exercises required to maintain function do not require the skills of a therapist and would not constitute skilled rehabilitation services (see paragraph (c) of this section). Similarly, repetitious exercises to improve gait, maintain strength, or endurance; passive exercises to maintain range of motion in paralyzed extremities, which are not related to a specific loss of function; and assistive walking do not constitute skilled rehabilitation services."
    summary_zh: 不需要专业人员技能的个人护理不是 skilled（A12 的特殊并发症情形除外），如常规口服药、协助穿衣进食如厕、翻身摆体位、一般监督已教会的运动等。

  - id: A18
    cfr: 42 CFR 409.34(a)
    type: definition
    plan_criterion: C5
    title: Frequency that meets "daily basis"
    text_verbatim: >-
      To meet the daily basis requirement specified in § 409.31(b)(1), the following frequency is required:
    conditions_verbatim:
      - Skilled nursing services or skilled rehabilitation services must be needed and provided 7 days a week; or
      - >-
        As an exception, if skilled rehabilitation services are not available 7 days a week those services
        must be needed and provided at least 5 days a week.
    summary_zh: “每日”指 skilled nursing 或 skilled rehab 每周 7 天都需要并提供；若 skilled rehab 无法每周 7 天提供，则至少每周 5 天。
    note: At PA time only the need can be judged; "provided" is checked later in the stay.

  - id: A19
    cfr: 42 CFR 409.34(b)
    type: interpretive_rule
    plan_criterion: C5
    title: A one- or two-day break does not break "daily basis"
    text_verbatim: >-
      A break of one or two days in the furnishing of rehabilitation services will not preclude coverage if
      discharge would not be practical for the one or two days during which, for instance, the physician has
      suspended the therapy sessions because the patient exhibited extreme fatigue.
    summary_zh: 康复服务中断一两天（例如病人极度疲劳、医师暂停治疗），只要这一两天让病人出院不现实，就不影响覆盖。

  - id: A20
    cfr: 42 CFR 409.35
    type: interpretive_rule
    plan_criterion: C6
    title: How to judge "practical matter"
    summary_zh: 判断 practical matter 要看病人状况和更经济替代方案的可行性，不看 Medicare 是否付费；每天往返会造成过度身体负担，或唯一替代是每天救护车，都属于符合的情形。
    parts:
      - id: A20.1
        cfr: 42 CFR 409.35(a)
        title: General considerations
        text_verbatim: >-
          In making a "practical matter" determination, as required by § 409.31(b)(3), consideration must be
          given to the patient's condition and to the availability and feasibility of using more economical
          alternative facilities and services. However, in making that determination, the availability of
          Medicare payment for those services may not be a factor. For example, if a beneficiary can obtain
          daily physical therapy services on an outpatient basis, the unavailability of Medicare payment for
          those alternative services due to the beneficiary's non-enrollment in Part B may not be a basis for
          finding that the needed care can only be provided in a SNF.
        summary_zh: 判断 practical matter 要考虑病人状况，以及更经济的替代设施和服务是否可得、是否可行；但不得把 Medicare 能否支付这些替代服务当作因素。
        guardrail: Whether an alternative (home health, outpatient) would be paid for must not decide C6.  # reading of the text above
      - id: A20.2
        cfr: 42 CFR 409.35(b)(1)
        title: Beneficiary's condition
        text_verbatim: >-
          Inpatient care would be required "as a practical matter" if transporting the beneficiary to and from
          the nearest facility that furnishes the required daily skilled services would be an excessive
          physical hardship.
        summary_zh: 若每天往返最近的提供所需 skilled 服务的机构会造成过度的身体负担，即需要住院照护。
      - id: A20.3
        cfr: 42 CFR 409.35(b)(2)
        title: Economy and efficiency
        text_verbatim: >-
          Even if the beneficiary's condition does not preclude transportation, inpatient care might be more
          efficient and less costly if, for instance, the only alternative is daily transportation by
          ambulance.
        summary_zh: 即使病情允许交通往返，若唯一的替代方案是每天救护车接送，住院照护可能更高效、更省钱。

evidence_hints:
  about: >-
    What to look for in the PA packet for each LLM-judged criterion (C3-C6). Written by Claude from the
    cards above and Medicare Benefit Policy Manual Ch.8 (bp102c08.pdf); not regulation wording and not
    clinical advice. Intended use: the Abstractor's evidence fields, the Reviewer's checklist, and RFI
    wording when evidence is missing. Positive and negative worked examples are not here yet (planned for
    Step 6 prompt tuning, kept in a separate field). All evidence must be dated at or before T_pa (D6).
  fields:
    supports: findings that weigh toward MET
    against: findings that weigh toward NOT_MET
    pend_if: what is missing that should lead to PEND_INFO rather than a decision
    rfi: what to ask the hospital for when pending
    sources: where the evidence sits in the packet (MIMIC adapter; see plan Step 6 mapping)
    cautions: common reasoning errors to avoid

  cross_criterion_guardrails:
    - Do not deny for lack of improvement potential or plateau; skilled maintenance can be covered (A13, A16 note, Ch.8 §30.4.1.2.E).
    - Personal or custodial care alone is not skilled (A17, Ch.8 §30.5).
    - A diagnosis by itself does not establish a skilled need; cite the service the condition requires.
    - Do not use predicted length of stay as a reason to deny or shorten.
    - Masked text (disposition or PT/OT recommendation removed per D7) is not evidence either way.

  C3:
    cards: [A9]
    question: Is the expected SNF care for a condition treated during this hospital stay?
    supports:
      - The skilled need follows from the reason for admission or a procedure done this stay (e.g. rehab after hip fracture repair, care of a surgical wound, IV antibiotics started for an infection treated here).
      - A complication that arose and was treated during the stay (e.g. hospital-acquired pressure injury, deconditioning after a prolonged or ICU stay with PT involvement).
    against:
      - The only care needs are for a chronic condition that was not addressed this stay, or for pre-existing custodial needs.
    pend_if:
      - The packet does not say what the SNF stay would treat.
    rfi:
      - Physician statement of the condition the SNF care is for.
    sources:
      - diagnoses_icd (as coded at submission)
      - ED triage chief complaint and ED diagnosis
      - HPI and Hospital Course
      - radiology reports before T_pa
    cautions:
      - Do not use DRG codes (assigned after discharge).
      - Under an MA plan with the 422.101(c) waiver this criterion is deemed met (409.30(b)(2)(ii)); the Aggregator applies that from the plan profile, not the LLM.

  C4:
    cards: [A7, A8, A11, A12, A13, A14, A15, A16, A17]
    question: Does the patient need services that require skilled nursing or skilled rehabilitation personnel?
    supports:
      - Ongoing skilled nursing services from A15 still active at T_pa (e.g. IV or IM medication continuing after discharge with a PICC or OPAT plan; new enteral feeding meeting the 26% / 501 ml thresholds; tracheostomy suctioning; wound care with prescription dressings or aseptic technique, wound vac; stage 3-4 or extensive pressure injuries).
      - Skilled rehab from A16 (e.g. PT/OT for impaired gait or transfers after surgery, stroke or acute illness, with goals; SLP for dysphagia or aphasia).
      - Observation and assessment of a condition not yet stable (A14.2, e.g. heart failure with active diuretic titration, unstable post-operative course, acute delirium).
      - Teaching that needs a nurse or therapist (A14.3, e.g. new insulin, new ostomy, prosthesis or gait training).
      - Several interacting conditions whose combined care needs skilled management (A14.1; may be inferred from the overall condition even if not stated).
      - A usually unskilled service made skilled by a documented complication (A12).
    against:
      - Only personal care from A17 (routine oral medications, help with bathing, dressing, toileting, routine catheter or noninfected dressing care).
      - The skilled need ended before T_pa (e.g. IV switched to oral, wound healed, back at baseline mobility and independent).
    pend_if:
      - A skilled service is mentioned but it is unclear whether it continues after discharge.
      - Functional status at discharge is not described.
    rfi:
      - PT/OT evaluation with current functional level and goals.
      - Active orders for IV therapy, wound care or feeding with expected duration.
    sources:
      - prescriptions and emar (route, frequency, still active)
      - poe (PICC, TPN, tube feeding, wound care, O2/BiPAP, PT/OT/speech consults, activity orders)
      - procedures_icd
      - chartevents for ICU stays (pressure injury, Braden, mobility)
      - Hospital Course
      - Discharge Condition (activity and mental status)
    cautions:
      - A15/A16 are examples, not an exhaustive list; A17 is also "not limited to".
      - The service must need skilled personnel because of its nature or the patient's condition, not because a nurse or therapist happens to do it.

  C5:
    cards: [A8, A18, A19]
    question: Is the skilled need daily (nursing 7 days a week, or rehab at least 5 days a week)?
    supports:
      - A daily skilled nursing need (e.g. IV antibiotics continuing, daily complex wound care, daily insulin titration with teaching).
      - Therapy needs that call for sessions at least 5 days a week (PT/OT frequency in orders or notes, intensive post-operative or post-stroke rehab).
      - Different skilled services that together cover every day for a medical reason (Ch.8 §30.6).
      - A skilled restorative nursing program needed at least 6 days a week (Ch.8 §30.6).
    against:
      - Intermittent need only (e.g. dressing change a few times a week, therapy 2-3 times a week, a one-time teaching session).
      - The daily service ends within a day or two after discharge (e.g. the last IV antibiotic dose falls the day after discharge).
      - Therapy spread across days only to have something every day, without a medical reason (Ch.8 §30.6).
    pend_if:
      - The frequency or remaining duration of the skilled service is not stated.
    rfi:
      - Ordered frequency and expected duration of each skilled service.
    sources:
      - prescriptions (frequency, stop date)
      - poe (frequency fields)
      - PT/OT findings summarized in Hospital Course
    cautions:
      - At PA time judge the expected need; "provided" (A18) can only be checked during the stay.
      - A planned break of one or two days does not defeat daily basis (A19).

  C6:
    cards: [A10, A20]
    question: As a practical matter, can the daily skilled care only be given as a SNF inpatient?
    supports:
      - No capable and willing caregiver at home (lives alone, caregiver frail or working) while the patient needs supervision or help to be safe (Ch.8 §30.7).
      - Needs supervision or assistance to walk or transfer with fall risk, so home therapy would be unsafe (the Ch.8 §30.7 example).
      - Cognitive impairment or delirium that prevents safe care at home.
      - Travelling daily to outpatient care would be an excessive physical hardship, or the only option is daily ambulance transport (A20.2, A20.3).
      - Several daily skilled needs that home health or outpatient services could not feasibly cover.
    against:
      - Capable and willing family at home and the patient is safe there with home health or outpatient services.
      - Walks independently or with a device and can travel to outpatient therapy.
    pend_if:
      - Social history, home situation or caregiver availability is missing (common in discharge summaries).
    rfi:
      - Living situation, caregiver availability and capacity, home access (stairs), transport options, availability of home health or outpatient therapy near the patient.
    sources:
      - Social History
      - Discharge Condition (activity and mental status)
      - ED arrival transport
      - chartevents for ICU stays (fall risk, ambulatory aid, gait/transferring)
    cautions:
      - Whether Medicare or the plan would pay for the alternative is not a factor (A20.1, Ch.8 §30.7.1).
      - Do not assume an older patient cannot go home; cite the specific barrier.
