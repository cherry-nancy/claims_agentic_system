#
# Retrieval evaluation set for the policy RAG index (plan Step 3: "30-50 questions -> the § they should hit,
# measure recall@5"). Questions are phrased as a reviewer would ask them, not copied from the source text.
#
# A question is a hit at k if one of the top-k chunks covers one of its `expect` citations. A chunk covers a
# citation if one of its `paragraphs` equals it or is inside it (e.g. "42 CFR 409.34(a)(2)" is inside
# "42 CFR 409.34"; "BPM Ch.8 §30.4.1" is inside "BPM Ch.8 §30.4"; "... FAQ 2024-02-06 Q7 (part 2)" inside "... Q7").
# A citation starting with "=" means that section's own text only, not its subsections: "=BPM Ch.8 §30" is not
# covered by a chunk of §30.6. It is used where the rule sits in a parent section's own text.
#
# Sources (all in policy_docs/):
#   42 CFR ...      eCFR XML files named in src/snf_pa/rag/sources.py (up to date as of 2026-10-29 / 2026-10-30)
#   BPM Ch.8 §...   bp102c08.pdf, Medicare Benefit Policy Manual Ch.8, Rev. 12283 (issued 2023-10-05)
#   CMS HPMS FAQ    cms_hpms_faq_coverage_criteria_um_2024-02-06.pdf (HPMS memo, 2024-02-06)
