items:
  # --- C1-C3: qualifying stay, transfer, related condition -------------------------------------------------
  - id: q01
    question: The patient was an inpatient for only two midnights before going to the SNF. Is the hospital stay requirement met?
    expect: ["42 CFR 409.30(a)", "BPM Ch.8 §20.1"]
  - id: q02
    question: Do hours spent in observation status count toward the three-day inpatient hospital stay?
    expect: ["BPM Ch.8 §20.1"]
  - id: q03
    question: The patient went home after the hospital and was admitted to a SNF three weeks later. Is that still post-hospital SNF care?
    expect: ["42 CFR 409.30(b)", "BPM Ch.8 §20.2"]
  - id: q04
    question: When can SNF admission be deferred more than 30 days after hospital discharge because the need for care was predictable?
    expect: ["42 CFR 409.30(b)(2)", "BPM Ch.8 §20.2.2"]
  - id: q05
    question: Must the SNF care be for a condition that was treated during the qualifying hospital stay?
    # BPM §20.1 and §30 also state the rule ("for a condition for which the beneficiary was receiving inpatient
    # hospital services"); added after the first run showed the key was incomplete.
    expect: ["42 CFR 409.31(b)", "BPM Ch.8 §20.1", "=BPM Ch.8 §30"]
  - id: q06
    question: A patient is readmitted to the SNF ten days after being discharged from it. Is a new three-day hospital stay needed?
    expect: ["42 CFR 409.36", "BPM Ch.8 §20.2.3"]
  # --- C4: skilled services -------------------------------------------------------------------------------
  - id: q07
    question: What makes a service skilled, as opposed to care a non-professional could give?
    expect: ["42 CFR 409.32(a)", "BPM Ch.8 §30.2.1", "BPM Ch.8 §30.2.2"]
  - id: q08
    question: The patient has no potential to improve. Can SNF coverage be denied on that basis?
    # BPM §30, §30.3 and §30.4 each state the rule: coverage "does not turn on the presence or absence of [a
    # beneficiary's] potential for improvement ... but rather on the beneficiary's need for skilled care" (§30: for a
    # maintenance program; §30.3: nursing; §30.4: therapy). Added after the 2026-11-07 run, checked against the text.
    expect: ["42 CFR 409.32(c)", "BPM Ch.8 §30.2.2", "=BPM Ch.8 §30", "=BPM Ch.8 §30.3", "=BPM Ch.8 §30.4"]
  - id: q09
    question: Is skilled therapy to maintain function or prevent decline covered when no improvement is expected?
    expect: ["BPM Ch.8 §30.2.2", "BPM Ch.8 §30.4", "42 CFR 409.32(c)"]
  - id: q10
    question: How should the medical record document that skilled care was needed?
    expect: ["BPM Ch.8 §30.2.2.1"]
  - id: q11
    question: Are daily insulin injections a skilled nursing service?
    expect: ["42 CFR 409.33(b)", "BPM Ch.8 §30.3"]
  - id: q12
    question: Is nasogastric or gastrostomy tube feeding considered skilled nursing?
    expect: ["42 CFR 409.33(b)", "BPM Ch.8 §30.3"]
  - id: q13
    question: Does dressing and treatment of a stage 3 pressure ulcer count as a skilled service?
    expect: ["42 CFR 409.33(b)", "BPM Ch.8 §30.3"]
  - id: q14
    question: Can observing and assessing an unstable patient's changing condition be a skilled service by itself?
    expect: ["42 CFR 409.33(a)(2)", "BPM Ch.8 §30.2.3.2"]
  - id: q15
    question: When does a nurse's management and evaluation of the overall care plan qualify as skilled care?
    expect: ["42 CFR 409.33(a)(1)", "BPM Ch.8 §30.2.3.1"]
  - id: q16
    question: Is teaching the patient or family to manage a new colostomy or insulin regimen a skilled service?
    expect: ["42 CFR 409.33(a)(3)", "BPM Ch.8 §30.2.3.3"]
  - id: q17
    question: Help with bathing, dressing and walking — is that custodial rather than skilled?
    expect: ["42 CFR 409.33(d)", "BPM Ch.8 §30.5"]
  - id: q18
    question: Is gait training after a hip fracture repair a skilled physical therapy service?
    expect: ["42 CFR 409.33(c)", "BPM Ch.8 §30.4.1"]
  - id: q19
    question: Is swallowing therapy for dysphagia after a stroke covered as skilled speech-language pathology?
    expect: ["BPM Ch.8 §30.4.2", "42 CFR 409.33(c)"]
  - id: q20
    question: Does occupational therapy to retrain activities of daily living count as skilled rehabilitation?
    expect: ["BPM Ch.8 §30.4.3", "42 CFR 409.33(c)"]
  - id: q21
    question: What should a reviewer do when it is unclear whether a service needs skilled personnel?
    expect: ["BPM Ch.8 §30.2.4", "BPM Ch.8 §30.2.2"]
  # --- C5: daily basis ------------------------------------------------------------------------------------
  - id: q22
    question: How many days a week must skilled rehabilitation be given to meet the daily requirement?
    expect: ["42 CFR 409.34(a)(2)", "BPM Ch.8 §30.6"]
  - id: q23
    question: Does skilled nursing have to be needed seven days a week?
    expect: ["42 CFR 409.34(a)(1)", "BPM Ch.8 §30.6"]
  - id: q24
    question: Therapy was missed for a day or two because the patient was ill. Is the daily skilled care requirement still met?
    expect: ["42 CFR 409.34(b)", "BPM Ch.8 §30.6"]
  # --- C6: practical matter -------------------------------------------------------------------------------
  - id: q25
    question: Could the skilled services have been given at home or as an outpatient instead of in a SNF?
    expect: ["42 CFR 409.35", "BPM Ch.8 §30.7"]
  - id: q26
    question: If a cheaper alternative exists, does that rule out SNF care as a practical matter?
    expect: ["42 CFR 409.35(a)", "BPM Ch.8 §30.7.2"]
  - id: q27
    question: The patient is too frail to travel to outpatient therapy every day. Does that support inpatient SNF care?
    # BPM §30.7 itself names "transportation ... would be an excessive physical hardship"; added after the first run.
    expect: ["42 CFR 409.35(b)", "BPM Ch.8 §30.7.3", "=BPM Ch.8 §30.7"]
  - id: q28
    question: How does the availability of home health or outpatient services in the patient's area affect coverage?
    expect: ["BPM Ch.8 §30.7.1", "42 CFR 409.35"]
  # --- C7-C8: certification, benefit days ------------------------------------------------------------------
  - id: q29
    question: When must the physician certify that the patient needs SNF care?
    expect: ["42 CFR 424.20", "BPM Ch.8 §40"]
  - id: q30
    question: Can a nurse practitioner or physician assistant sign the SNF certification?
    expect: ["42 CFR 424.20(e)", "BPM Ch.8 §40.1"]
  - id: q31
    question: How often must a SNF stay be recertified?
    expect: ["42 CFR 424.20", "BPM Ch.8 §40"]
  - id: q32
    question: How many days of SNF care does Medicare cover in one benefit period?
    expect: ["42 CFR 409.61(b)", "BPM Ch.8 §60"]
  - id: q33
    question: When does a new benefit period start after a patient leaves the hospital or SNF?
    expect: ["42 CFR 409.60"]
  - id: q34
    question: Is the patient presumed to meet the level of care at admission based on the initial assessment classification?
    expect: ["BPM Ch.8 §30.1"]
  # --- Medicare Advantage: criteria, prior authorization, determinations, appeals ------------------------
  - id: q35
    question: Can a Medicare Advantage plan use its own internal criteria, such as a commercial guideline, to deny SNF care?
    expect: ["42 CFR 422.101(b)", "CMS HPMS FAQ 2024-02-06 Q1", "CMS HPMS FAQ 2024-02-06 Q7"]
  - id: q36
    question: Can an MA plan deny admission to a SNF when the Traditional Medicare coverage criteria are met?
    expect: ["CMS HPMS FAQ 2024-02-06 Q7", "42 CFR 422.101(c)"]
  - id: q37
    question: Who must review an MA denial based on lack of medical necessity?
    expect: ["42 CFR 422.566(d)"]
  - id: q38
    question: How long does an MA plan have to decide a standard pre-service request?
    expect: ["42 CFR 422.568(b)"]
  - id: q39
    question: What is the deadline for an expedited organization determination?
    expect: ["42 CFR 422.572(a)"]
  - id: q40
    question: What must a written MA denial notice say?
    expect: ["42 CFR 422.568"]
  - id: q41
    question: What may an MA plan use prior authorization for, and how long does an approval stay valid?
    expect: ["42 CFR 422.138", "CMS HPMS FAQ 2024-02-06 Q11"]
  - id: q42
    question: A new enrollee is in the middle of a course of treatment. Is there a transition period before prior authorization applies?
    expect: ["42 CFR 422.112(b)(8)"]
  - id: q43
    question: How does a patient appeal the plan's decision to end covered SNF services?
    expect: ["42 CFR 422.626"]
  - id: q44
    question: Does the interrupted stay policy apply in Medicare Advantage?
    expect: ["CMS HPMS FAQ 2024-02-06 Q10"]
  # --- Adjacent program (tier 3 background, never a basis for a SNF decision) -----------------------------
  - id: q45
    question: What therapy intensity does an inpatient rehabilitation facility require, such as three hours a day?
    expect: ["42 CFR 412.622(a)(3)"]
  # ============================================================================================================
  # q46-q171: added 2026-11-08 by Claude (claude-opus-5-5) to make the set harder and larger (it had reached
  # recall@5 1.00 for two models). Each item has:
  #   kind      paraphrase (case-manager wording) | subparagraph (the rule sits in one CFR paragraph) |
  #             multi (needs two rules: expect_all, every group must be in the top k) | ma | adjacent
  #   author    claude (all items so far). Reviewer-written items go in the section at the end.
  #   evidence  text copied exactly from an expected chunk (checked by tests/test_policy_chunks.py); the key
  #             lists every chunk the corpus search found stating the same rule.
  # ============================================================================================================
  # --- C1: qualifying stay -------------------------------------------------------------------------------
  - id: q46
    question: He came through the ER, sat in obs for two days and was then admitted for two nights. Do the obs days count toward the 3 days?
    expect: ["BPM Ch.8 §20.1", "=BPM Ch.8 §10"]
    evidence: "Time spent in observation or in the emergency room prior to (or in lieu of) an inpatient admission"
    kind: paraphrase
    author: claude
  - id: q47
    question: Do we count the day she was admitted to the hospital? And the day she left?
    expect: ["BPM Ch.8 §20.1", "42 CFR 409.30(a)"]
    evidence: "the day of admission, but not the day of discharge, is counted as a hospital inpatient day"
    kind: paraphrase
    author: claude
  - id: q48
    question: The patient was transferred between two hospitals during the admission. Can those days be added up toward the three days?
    expect: ["BPM Ch.8 §20.1"]
    evidence: "stays totaling 3 consecutive days in one or more hospitals"
    kind: paraphrase
    author: claude
  - id: q49
    question: For the last day in the hospital he was basically just waiting for placement. Which date counts as his hospital discharge?
    expect: ["BPM Ch.8 §20.1", "BPM Ch.8 §20.2.1"]
    evidence: "becomes less intensive during the latter part of the stay"
    kind: paraphrase
    author: claude
  - id: q50
    question: Does a three-day stay in a psych hospital count as the qualifying hospital stay?
    expect: ["BPM Ch.8 §20.1"]
    evidence: "a 3-day stay in a psychiatric hospital satisfies the prior hospital stay requirement"
    kind: paraphrase
    author: claude
  - id: q51
    question: She was hospitalized for a week while traveling overseas. Can that stay qualify her for SNF coverage back home?
    expect: ["BPM Ch.8 §20.1.1"]
    evidence: "Regardless of whether a foreign hospital stay is itself coverable"
    kind: paraphrase
    author: claude
  - id: q52
    question: Acute care was over but no SNF bed was open, so the patient stayed in the hospital. Can those extra days still be covered?
    expect: ["BPM Ch.8 §20.1"]
    evidence: "no SNF bed is available"
    kind: paraphrase
    author: claude
  - id: q53
    question: Can a small rural hospital give SNF-level care in its own beds instead of sending the patient to a SNF?
    expect: ["BPM Ch.8 §10.3", "42 CFR 409.30"]
    evidence: "if it has obtained a swing bed approval from the Department of Health and Human Services"
    kind: paraphrase
    author: claude
  - id: q54
    question: A swing-bed patient no longer needs SNF-level care. What pays for the rest of the stay?
    expect: ["BPM Ch.8 §10.3"]
    evidence: "Swing bed patients who no longer qualify for Part A coverage of SNF-level services"
    kind: adjacent
    author: claude
  # --- C2: 30-day transfer, readmission -----------------------------------------------------------------
  - id: q55
    question: Discharged from the hospital on August 1 and admitted to the SNF on August 31. Is that inside the 30 days?
    expect: ["BPM Ch.8 §20.2.1"]
    evidence: "a patient discharged from a hospital on August 1 and admitted to a SNF on August 31 was admitted within 30 days"
    kind: paraphrase
    author: claude
  - id: q56
    question: She went into the nursing home a week after discharge but only needed custodial care until day 35, when therapy started. Does the transfer rule hold?
    expect: ["BPM Ch.8 §20.2.1"]
    evidence: "does not require a covered level of care until more than 30 days after such discharge"
    kind: paraphrase
    author: claude
  - id: q57
    question: Hip fracture, non-weight-bearing for now; rehab is planned in about five weeks. Can SNF admission wait past 30 days?
    expect: ["BPM Ch.8 §20.2.2.1", "BPM Ch.8 §20.2.2", "42 CFR 409.30(b)(2)"]
    evidence: "the admission of a patient with a hip fracture to a SNF within 4 to 6 weeks after hospital discharge"
    kind: paraphrase
    author: claude
  - id: q58
    question: At discharge nobody knew whether he would need more care; six weeks later he declined at home. Can the 30-day exception be used?
    expect: ["BPM Ch.8 §20.2.2.2"]
    evidence: "such cases do not fall within the 30-day"
    kind: paraphrase
    author: claude
  - id: q59
    question: Rehab was deliberately postponed, then a wound infection pushed the start date back again. Is the 30-day rule still satisfied?
    expect: ["BPM Ch.8 §20.2.2.4"]
    evidence: "if the care is begun as soon as medically possible"
    kind: paraphrase
    author: claude
  - id: q60
    question: The patient was in a Medicare Advantage plan on the day of SNF admission. Does the 30-day transfer rule apply the same way?
    expect: ["42 CFR 409.30(b)(2)"]
    evidence: "If, upon admission to the SNF, the beneficiary was enrolled in an M + C plan"
    kind: subparagraph
    author: claude
  - id: q61
    question: After Medicare days ended he stayed on as a custodial resident, and three weeks later needed skilled care again. Is that covered without a new hospital stay?
    expect: ["BPM Ch.8 §20.2.3"]
    evidence: "remains in the SNF to receive custodial care following a covered stay"
    kind: paraphrase
    author: claude
  # --- C3: related condition ----------------------------------------------------------------------------
  - id: q62
    question: Admitted to the SNF after hip surgery, she then developed pneumonia there. Can SNF coverage be for the pneumonia?
    expect: ["42 CFR 409.31(b)", "BPM Ch.8 §20.1", "=BPM Ch.8 §10"]
    evidence: "arose while the beneficiary was receiving care in a SNF"
    kind: paraphrase
    author: claude
  # --- C4: skilled services -----------------------------------------------------------------------------
  - id: q63
    question: Tube feeds give her about a third of her calories and 600 ml of fluid a day. Is that skilled nursing?
    expect: ["42 CFR 409.33(b)", "BPM Ch.8 §30.3"]
    evidence: "Enteral feeding that comprises at least 26 per cent of daily calorie requirements"
    kind: subparagraph
    author: claude
  - id: q64
    question: He has a trach and needs suctioning several times a shift. Skilled?
    expect: ["42 CFR 409.33(b)", "BPM Ch.8 §30.3"]
    evidence: "tracheostomy aspiration"
    kind: paraphrase
    author: claude
  - id: q65
    question: Is changing and sterile-flushing a suprapubic catheter a skilled nursing service?
    expect: ["42 CFR 409.33(b)", "BPM Ch.8 §30.3"]
    evidence: "replacement of suprapubic catheters"
    kind: paraphrase
    author: claude
  - id: q66
    question: Routine Foley care, emptying the bag and making sure it drains. Is that skilled?
    expect: ["42 CFR 409.33(d)", "BPM Ch.8 §30.5"]
    evidence: "maintain satisfactory functioning of indwelling bladder catheters"
    kind: paraphrase
    author: claude
  - id: q67
    question: She is getting IM shots and IV fluids. Do those count as skilled nursing?
    expect: ["42 CFR 409.33(b)", "BPM Ch.8 §30.3"]
    evidence: "Intravenous or intramuscular injections and intravenous feeding"
    kind: paraphrase
    author: claude
  - id: q68
    question: The patient just started nebulized bronchodilators. Is that a skilled service?
    expect: ["BPM Ch.8 §30.3", "42 CFR 409.33(b)"]
    evidence: "Initial phases of a regimen involving administration of medical gases"
    kind: paraphrase
    author: claude
  - id: q69
    question: Colostomy care right after surgery versus months later. Which one is skilled?
    expect: ["BPM Ch.8 §30.3", "42 CFR 409.33(d)", "BPM Ch.8 §30.5"]
    evidence: "Care of a colostomy during the early post-operative"
    kind: paraphrase
    author: claude
  - id: q70
    question: He can't move himself in bed and needs turning every two hours. Is the turning a skilled service?
    expect: ["42 CFR 409.33(d)", "BPM Ch.8 §30.5", "BPM Ch.8 §30.2.2"]
    evidence: "Periodic turning and positioning in bed"
    kind: paraphrase
    author: claude
  - id: q71
    question: Whirlpool baths mainly for comfort. Do they count as skilled PT?
    expect: ["42 CFR 409.33(d)", "BPM Ch.8 §30.5", "BPM Ch.8 §30.4.1.2", "BPM Ch.8 §30.2.2"]
    evidence: "Use of heat as a palliative and comfort measure"
    kind: paraphrase
    author: claude
  - id: q72
    question: When would hot packs or whirlpool actually need a physical therapist?
    expect: ["42 CFR 409.33(c)", "BPM Ch.8 §30.4.1.2", "BPM Ch.8 §30.2.2"]
    evidence: "complicated by circulatory deficiency"
    kind: paraphrase
    author: claude
  - id: q73
    question: Do ultrasound or diathermy treatments have to be given by a qualified PT?
    expect: ["42 CFR 409.33(c)", "BPM Ch.8 §30.4.1.2"]
    evidence: "Ultrasound, short-wave, and microwave therapy treatment by a qualified physical therapist"
    kind: subparagraph
    author: claude
  - id: q74
    question: An aide does passive range-of-motion on her paralyzed arm every day. Is that skilled therapy?
    expect: ["42 CFR 409.33(d)", "BPM Ch.8 §30.4.1.2", "BPM Ch.8 §30.5"]
    evidence: "passive exercises to maintain range of motion in paralyzed extremities"
    kind: paraphrase
    author: claude
  - id: q75
    question: Can a nurse aide do range-of-motion testing, or does it need a therapist?
    expect: ["BPM Ch.8 §30.4.1.2", "42 CFR 409.33(c)"]
    evidence: "Only the qualified physical therapist may perform range of motion tests"
    kind: paraphrase
    author: claude
  - id: q76
    question: A Parkinson's patient who has never had rehab needs a home exercise program designed. Is designing it skilled?
    expect: ["42 CFR 409.33(c)", "BPM Ch.8 §30.4.1.2", "=BPM Ch.8 §30.4"]
    evidence: "a patient with Parkinson's disease who has not been under a rehabilitation regimen"
    kind: paraphrase
    author: claude
  - id: q77
    question: A leg cast usually isn't skilled care. When could it be?
    expect: ["42 CFR 409.32(b)", "BPM Ch.8 §30.2.2"]
    evidence: "a plaster cast on a leg does not usually require skilled care"
    kind: subparagraph
    author: claude
  - id: q78
    question: Heart failure patient who needs to be watched closely for fluid overload. Is that watching skilled?
    expect: ["42 CFR 409.33(a)(2)", "BPM Ch.8 §30.2.3.2"]
    evidence: "continuous close observation to detect signs of decompensation"
    kind: paraphrase
    author: claude
  - id: q79
    question: We admitted him for close monitoring and the complication never happened. Is the monitoring still covered?
    expect: ["BPM Ch.8 §30.2.3.2"]
    evidence: "skilled observation services still are covered so long as there was a reasonable probability"
    kind: paraphrase
    author: claude
  - id: q80
    question: Besides the hip fracture she is acutely agitated and depressed. Can monitoring those symptoms be skilled care?
    expect: ["42 CFR 409.33(a)(2)", "BPM Ch.8 §30.2.3.2"]
    evidence: "acute psychological symptoms such as depression, anxiety"
    kind: paraphrase
    author: claude
  - id: q81
    question: None of his services is skilled on its own. When does managing all of them together become skilled?
    expect: ["42 CFR 409.33(a)(1)", "BPM Ch.8 §30.2.3.1"]
    evidence: "the aggregate of those services requires"
    kind: paraphrase
    author: claude
  - id: q82
    question: Nobody at home can do her care and no aide is available. Does that make the care skilled?
    expect: ["BPM Ch.8 §30.3", "BPM Ch.8 §30.4.1.2"]
    evidence: "the unavailability of a competent person to provide a nonskilled service"
    kind: paraphrase
    author: claude
  - id: q83
    question: He has been taught his diabetic diet but keeps refusing to follow it. Is more teaching still skilled?
    expect: ["BPM Ch.8 §30.2.3.3"]
    evidence: "refuses to comply"
    kind: paraphrase
    author: claude
  - id: q84
    question: Is teaching a patient to catheterize herself or give her own G-tube feeds a skilled service?
    expect: ["BPM Ch.8 §30.2.3.3", "42 CFR 409.33(a)(3)"]
    evidence: "Teaching patients how to perform self-catheterization"
    kind: paraphrase
    author: claude
  - id: q85
    question: She is going home with a Hickman line. Is teaching her to care for it skilled?
    expect: ["BPM Ch.8 §30.2.3.3"]
    evidence: "Hickman catheters"
    kind: paraphrase
    author: claude
  - id: q86
    question: Is a note like 'patient tolerated treatment well' enough documentation for skilled therapy?
    expect: ["BPM Ch.8 §30.2.2.1"]
    evidence: "Such phraseology does not provide a clear picture of the results of the treatment"
    kind: paraphrase
    author: claude
  - id: q87
    question: Do we judge whether care was skilled by what was expected when it was ordered, or by how things turned out?
    expect: ["BPM Ch.8 §30.2.2.1"]
    evidence: "when the services were ordered and what was, at that time, reasonably expected"
    kind: paraphrase
    author: claude
  - id: q88
    question: Suprapubic catheter irrigation is skilled, but the order is daily and the patient doesn't need it that often. Is daily irrigation covered?
    expect: ["=BPM Ch.8 §30"]
    evidence: "daily irrigation may not be"
    kind: paraphrase
    author: claude
  - id: q89
    question: The service matters a lot to the patient and is done many times a day. Does that make it skilled?
    expect: ["BPM Ch.8 §30.2.2"]
    evidence: "does not, by itself, make it a skilled service"
    kind: paraphrase
    author: claude
  - id: q90
    question: PT is expected to make only a tiny difference after weeks of work. Is it still covered?
    expect: ["BPM Ch.8 §30.4.1.1"]
    evidence: "if the expected results are insignificant in relation to the extent and duration"
    kind: paraphrase
    author: claude
  - id: q91
    question: He left the SNF and came back. Does PT need a new evaluation before restarting?
    expect: ["BPM Ch.8 §30.4.1.1"]
    evidence: "an initial evaluation must be performed upon readmission to the SNF"
    kind: paraphrase
    author: claude
  # --- C5: daily basis ----------------------------------------------------------------------------------
  - id: q92
    question: Therapy is only Monday, Wednesday and Friday. Is the daily requirement met?
    expect: ["BPM Ch.8 §30.6", "42 CFR 409.34(a)"]
    evidence: "If therapy services are provided less than 5 days a week"
    kind: paraphrase
    author: claude
  - id: q93
    question: How long is a skilled restorative program usually expected to run?
    expect: ["BPM Ch.8 §30.6"]
    evidence: "only a few weeks in duration"
    kind: paraphrase
    author: claude
  - id: q94
