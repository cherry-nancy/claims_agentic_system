[project]
name = "snf-pa"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "langchain-aws>=1.9.0",
    "langchain-core>=1.7.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.16",
    "polars>=2.0.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: reads big raw tables or calls an LLM; skipped by the Stop hook"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snf_pa"]
